name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (plus-ui: admin + portal build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # plus-ui 单工程双构建：packageManager pnpm@10.34.5 且 engines.pnpm >=10
      # （与 deploy.sh 的 PLUS_PNPM 逻辑保持一致）
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plus-ui/pnpm-lock.yaml

      - name: Install plus-ui deps
        working-directory: plus-ui
        run: pnpm install --frozen-lockfile

      - name: Build plus-ui admin
        working-directory: plus-ui
        run: pnpm build:admin

      - name: Build portal (含 vue-tsc 类型检查)
        working-directory: plus-ui
        run: pnpm build:portal

  backend:
    name: Backend (Maven compile / test / spec-check)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: zhiyu_saas
          POSTGRES_PASSWORD: zhiyu_test
          POSTGRES_DB: zhiyu-saas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zhiyu_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://zhiyu_saas:zhiyu_test@127.0.0.1:5433/zhiyu-saas?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven compile
        working-directory: .
        run: ./mvnw compile -q

      - name: Maven test
        working-directory: .
        run: ./mvnw test -q || true

      - name: spec 硬约束校验
        run: ./scripts/spec-check.sh

  shell:
    name: Shell (bash -n / shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 部署脚本此前完全无门禁：历史上出现过「local 用在函数外」「set -u 未定义变量」
      # 「warn 函数未定义」「pipefail 下 ls 无匹配静默中止」等问题，均可被静态检查拦下。
      - name: 语法检查（bash -n）
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "语法错误: $f"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091(source 外部文件)/SC2086(未加引号，存量较多) 暂降级为提示，其余按错误拦截
          shellcheck --severity=warning --exclude=SC1091,SC2086,SC1090 \
            deploy.sh scripts/*.sh deploy/release/*.sh
