name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck / lint / test / format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

  backend:
    name: Backend (vet / build / test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: zhiyu_saas
          POSTGRES_PASSWORD: zhiyu_test
          POSTGRES_DB: zhiyu-saas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zhiyu_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://zhiyu_saas:zhiyu_test@127.0.0.1:5433/zhiyu-saas?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go/go.sum

      - name: gofmt check
        working-directory: backend/go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: backend/go
        run: go vet ./...

      - name: go build
        working-directory: backend/go
        run: go build ./...

      - name: go test
        working-directory: backend/go
        run: go test ./...

      - name: spec 硬约束校验
        run: ./scripts/spec-check.sh

  shell:
    name: Shell (bash -n / shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 部署脚本此前完全无门禁：历史上出现过「local 用在函数外」「set -u 未定义变量」
      # 「warn 函数未定义」「pipefail 下 ls 无匹配静默中止」等问题，均可被静态检查拦下。
      - name: 语法检查（bash -n）
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "语法错误: $f"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091(source 外部文件)/SC2086(未加引号，存量较多) 暂降级为提示，其余按错误拦截
          shellcheck --severity=warning --exclude=SC1091,SC2086,SC1090 \
            deploy.sh deploy-java.sh scripts/*.sh deploy/release/*.sh
