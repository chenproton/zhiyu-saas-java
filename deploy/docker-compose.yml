name: zhiyu-saas

services:
  mysql:
    image: mysql:8.0
    container_name: zhiyu-mysql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: ${DB_NAME:-zhiyu-saas}
      MYSQL_USER: ${DB_USER:-zhiyu_saas}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
      - "--max-connections=200"
      - "--innodb-buffer-pool-size=512M"
      - "--log-bin-trust-function-creators=1"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - zhiyu

  redis:
    image: redis:7-alpine
    container_name: zhiyu-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-ruoyi123}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - "900"
      - "1"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-ruoyi123} ping 2>/dev/null | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zhiyu

  java-backend:
    image: zhiyu-java-backend:${IMAGE_TAG:-latest}
    container_name: zhiyu-java-backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      ZHIYU_DB_HOST: mysql
      ZHIYU_DB_PORT: "3306"
      ZHIYU_DB_USER: ${DB_USER:-zhiyu_saas}
      ZHIYU_DB_PASSWORD: ${DB_PASSWORD}
      ZHIYU_REDIS_HOST: redis
      ZHIYU_REDIS_PORT: "6379"
      ZHIYU_REDIS_PASSWORD: ${REDIS_PASSWORD:-ruoyi123}
      ZHIYU_UPLOAD_DIR: /opt/zhiyu-saas/uploads
      # JWT_SECRET 必须显式提供（deploy.sh 首次部署自动生成 64 位随机值写入 .env）；缺失直接报错，禁止弱兜底
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置（请运行 ./deploy.sh 首次部署生成，或写入 .env）}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
    volumes:
      - uploads_data:/opt/zhiyu-saas/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - "/tmp:noexec,nosuid,size=100m"
      - "/app/logs:noexec,nosuid,size=10m"
      # spring.servlet.multipart.location=/basic/server/temp（application-prod.yml）：read_only 容器必须 tmpfs 可写，
      # 否则 Jetty 解析 multipart（Excel 导入/文件上传）报 400 bad multipart —— /basic 只读（部署实测）
      - "/basic/server/temp:noexec,nosuid,size=100m"
    networks:
      - zhiyu

  nginx:
    image: nginx:1.27-alpine
    container_name: zhiyu-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JAVA_NGINX_PORT:-8083}:80"
    volumes:
      - ./nginx-container/conf.d:/etc/nginx/conf.d:ro
      - ./web/portal:/usr/share/nginx/html/portal:ro
      - ./web/plus-ui:/usr/share/nginx/html/plus-ui:ro
    depends_on:
      - java-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/portal/login >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zhiyu

  kkfileview:
    profiles: ["kkfileview"]
    image: ${KKFILEVIEW_IMAGE:-fangzhengjin/kkfileview:4.4.0}
    container_name: zhiyu-kkfileview
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KKFILEVIEW_HOST_PORT:-8012}:8012"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      KK_BASE_URL: ${KK_BASE_URL:-http://ai.zhiyu.com.cn/kkfileview}
      KK_CONTEXT_PATH: /kkfileview
      KK_OFFICE_PREVIEW_TYPE: pdf
      KK_OFFICE_PREVIEW_SWITCH_DISABLED: "true"
      KK_MEDIA_CONVERT_DISABLE: ${KK_MEDIA_CONVERT_DISABLE:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8012/kkfileview/onlinePreview >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - zhiyu

volumes:
  mysql_data:
  redis_data:
  uploads_data:

networks:
  zhiyu:
    driver: bridge
