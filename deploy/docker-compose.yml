name: zhiyu-saas

services:
  postgres:
    # 不注入全量 .env：只需 environment 里的 POSTGRES_*；
    # 注入 JWT_SECRET/AI_CONFIG_SECRET 只会无谓扩大密钥暴露面
    image: postgres:15-alpine
    container_name: zhiyu-postgres
    restart: unless-stopped
    shm_size: 128mb
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${DB_USER:-zhiyu_saas}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-zhiyu-saas}
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=1000"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-zhiyu_saas} -d ${DB_NAME:-zhiyu-saas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zhiyu

  redis:
    # 无状态缓存；单栈化后 Java 后端（application-prod.yml 要求 redis 密码必须配置）
    # 使用口令连接，故设 requirepass（REDIS_PASSWORD，.env 首次生成）
    image: redis:7-alpine
    container_name: zhiyu-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:-ruoyi123}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - "900"
      - "1"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-ruoyi123} ping 2>/dev/null | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zhiyu

  java-backend:
    # 单栈（Java+Vue）：ruoyi-admin.jar，容器内 8080；DB/Redis 走容器网络直连
    image: zhiyu-java-backend:${IMAGE_TAG:-latest}
    container_name: zhiyu-java-backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      ZHIYU_DB_HOST: postgres
      ZHIYU_DB_PORT: "5432"
      ZHIYU_DB_USER: ${DB_USER:-zhiyu_saas}
      ZHIYU_DB_PASSWORD: ${DB_PASSWORD}
      ZHIYU_REDIS_HOST: redis
      ZHIYU_REDIS_PORT: "6379"
      ZHIYU_REDIS_PASSWORD: ${REDIS_PASSWORD:-ruoyi123}
      ZHIYU_UPLOAD_DIR: /opt/zhiyu-saas/uploads
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
    volumes:
      - uploads_data:/opt/zhiyu-saas/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:noexec,nosuid,size=100m"]
    networks:
      - zhiyu

  # 服务网关：静态服务 Vue 业务门户（根路径）与 RuoYi 管理端（/plus-ui/），
  # 并按容器名代理 java-backend（API/上传）与 kkfileview（预览）；
  # 仅暴露一个宿主端口（127.0.0.1:${JAVA_NGINX_PORT:-8083}）给系统 nginx（边缘网关）
  nginx:
    image: nginx:1.27-alpine
    container_name: zhiyu-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JAVA_NGINX_PORT:-8083}:80"
    volumes:
      - ./nginx-container/conf.d:/etc/nginx/conf.d:ro
      # Vue 构建产物（deploy.sh rsync 到 $DEPLOY_DIR/web/，compose 相对路径基于 project-directory）
      - ./web/portal:/usr/share/nginx/html/portal:ro
      - ./web/plus-ui:/usr/share/nginx/html/plus-ui:ro
    depends_on:
      - java-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/portal/login >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - zhiyu

  kkfileview:
    profiles: ["kkfileview"]
    # 高危第三方组件（LibreOffice/ffmpeg）：被打穿即可读环境变量，
    # 绝不能让它拿到 JWT_SECRET / DATABASE_URL（单栈化后无需再注入 AI_CONFIG_SECRET）
    image: ${KKFILEVIEW_IMAGE:-fangzhengjin/kkfileview:4.4.0}
    container_name: zhiyu-kkfileview
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KKFILEVIEW_HOST_PORT:-8012}:8012"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      KK_BASE_URL: ${KK_BASE_URL:-http://ai.zhiyu.com.cn/kkfileview}
      KK_CONTEXT_PATH: /kkfileview
      KK_OFFICE_PREVIEW_TYPE: pdf
      KK_OFFICE_PREVIEW_SWITCH_DISABLED: "true"
      # 该镜像逻辑：为 true 时远程 http(s) 视频（mov/avi/mkv 等 MEDIACONVERT 类型）才走 ffmpeg 转码预览，
      # 否则直接返回"系统还不支持该格式文件的在线预览"。默认值 true 固化在 deploy.sh（新装写入 .env，旧 .env 自动补写）
      KK_MEDIA_CONVERT_DISABLE: ${KK_MEDIA_CONVERT_DISABLE:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8012/kkfileview/onlinePreview >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - zhiyu

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  zhiyu:
    driver: bridge
