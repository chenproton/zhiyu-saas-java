# zhiyu-saas 网关配置（HTTP，默认）—— 边缘网关
# 职责：唯一对外入口，转发到服务网关容器 nginx（127.0.0.1:${GO_NGINX_PORT:-8084}）
# 占位符：${NGINX_SERVER_NAME:-_} ${NGINX_DEFAULT_SERVER:-default_server}
#          ${NGINX_PORT:-80} ${GO_NGINX_PORT:-8084} ${KKFILEVIEW_HOST_PORT:-8012}
server {
    listen ${NGINX_PORT:-80} ${NGINX_DEFAULT_SERVER:-default_server};
    listen [::]:${NGINX_PORT:-80} ${NGINX_DEFAULT_SERVER:-default_server};
    server_name ${NGINX_SERVER_NAME:-_};

    access_log /var/log/nginx/zhiyu-saas-access.log;
    error_log /var/log/nginx/zhiyu-saas-error.log;
    client_max_body_size 200m;

    # kkfileview 为可选 profile 服务，未启用时保持 502（与原行为一致）
    location /kkfileview/ {
        proxy_pass http://127.0.0.1:${KKFILEVIEW_HOST_PORT:-8012};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其余全部转发到服务网关容器（zhiyu-nginx），由其在容器网络内按容器名路由
    location /api/ {
        proxy_pass http://127.0.0.1:${GO_NGINX_PORT:-8084};
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:${GO_NGINX_PORT:-8084};
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 公司官网（officialwebsite 项目静态产物，deploy.sh 同步至 /var/www/officialwebsite/official）
    location /official/ {
        root /var/www/officialwebsite;
        index index.html;
        try_files $uri $uri/ =404;

        location ~* ^/official/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|avif|webp)$ {
            expires 1M;
            add_header Cache-Control "public, immutable";
        }
    }

    location = /official {
        return 301 /official/;
    }

    location / {
        proxy_pass http://127.0.0.1:${GO_NGINX_PORT:-8084};
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
