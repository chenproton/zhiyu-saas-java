# zhiyu-saas 前端反代
# 所有页面 → 127.0.0.1:3020（zhiyu-edu：课程/岗位/场景/测评/门户）
server {
    listen 80 ;
    listen [::]:80 ;
    server_name 111.170.170.202 ai.zhiyu.com.cn ;

    access_log /var/log/nginx/zhiyu-saas-access.log main;
    error_log /var/log/nginx/zhiyu-saas-error.log;

    # 资源/课件上传经前端 rewrite 到后端，放开 body 限制
    client_max_body_size 200m;

    # kkFileView 文件预览代理 → Docker 容器 8012（独立于 compose 部署）
    location /kkfileview/ {
        proxy_pass http://172.17.0.1:8012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API 后端代理 → Docker 容器 8080
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 文件上传代理 → Docker 容器 8080
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 所有页面 → 教育管理前端 (3020)
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
