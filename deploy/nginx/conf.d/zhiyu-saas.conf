# zhiyu-saas 网关配置（HTTP，默认）—— 边缘网关
# 职责：唯一对外入口，转发到服务网关容器 nginx（127.0.0.1:${GO_NGINX_PORT:-8084}）
# 占位符：${NGINX_SERVER_NAME:-_} ${NGINX_DEFAULT_SERVER:-default_server}
#          ${NGINX_PORT:-80} ${GO_NGINX_PORT:-8084} ${KKFILEVIEW_HOST_PORT:-8012}
server {
    listen ${NGINX_PORT:-80} ${NGINX_DEFAULT_SERVER:-default_server};
    listen [::]:${NGINX_PORT:-80} ${NGINX_DEFAULT_SERVER:-default_server};
    server_name ${NGINX_SERVER_NAME:-_};

    access_log /var/log/nginx/zhiyu-saas-access.log;
    error_log /var/log/nginx/zhiyu-saas-error.log;
    client_max_body_size 200m;

    # 安全响应头（此前两个模板均无任何安全头）。两层都加是有意为之：
    #   - 容器网关那层覆盖「宿主 HTTPS 入口 → 8084」的现网主链路（HTTPS conf 由人工维护、无安全头）；
    #   - 边缘这层额外覆盖不经网关的 /kkfileview/（直连 8012，预览转换后的文档同样需要 nosniff）。
    # 代价是 HTTP 响应里这三个头各出现两次（同值，浏览器取首个，无功能影响）。
    # nosniff 防 MIME 嗅探执行上传文件；SAMEORIGIN 防点击劫持；no-referrer-when-downgrade 防降级泄露；
    # 不加 CSP/HSTS——CSP 需按前端资源逐条实测、HSTS 由 HTTPS 入口统一负责，避免误伤现网。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # 文本类响应压缩（此前完全未启用；上传/预览二进制不压缩）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml application/wasm;

    # kkfileview 为可选 profile 服务，未启用时保持 502（与原行为一致）
    location /kkfileview/ {
        proxy_pass http://127.0.0.1:${KKFILEVIEW_HOST_PORT:-8012};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其余全部转发到服务网关容器（zhiyu-nginx），由其在容器网络内按容器名路由
    location /api/ {
        proxy_pass http://127.0.0.1:${GO_NGINX_PORT:-8084};
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:${GO_NGINX_PORT:-8084};
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Java 体系（zhiyu-java-nginx 容器，8083）：不剥离 /java 前缀
    # （java-nginx 按 /java/portal/ 与 /java/api/ 带前缀服务，剥离会导致门户 301 循环）
    location /java/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 公司官网（officialwebsite 项目静态产物，deploy.sh 同步至 /var/www/officialwebsite/official）
    location /official/ {
        root /var/www/officialwebsite;
        index index.html;
        try_files $uri $uri/ =404;

        location ~* ^/official/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|avif|webp)$ {
            expires 1M;
            add_header Cache-Control "public, immutable";
        }
    }

    location = /official {
        return 301 /official/;
    }

    location / {
        proxy_pass http://127.0.0.1:${GO_NGINX_PORT:-8084};
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
