# zhiyu-saas 网关配置
# server_name / ssl_cert 路径 / 端口 等由 deploy.sh 从 .env 载入并替换占位符
# 占位符：${NGINX_SERVER_NAME:-_} ${NGINX_DEFAULT_SERVER:-default_server}
#          ${NGINX_PORT:-80} ${NGINX_SSL_PORT:-443}
#          ${BACKEND_PORT:-8080} ${EDU_PORT:-3020} ${KKFILEVIEW_HOST_PORT:-8012}
#          ${NGINX_SSL_CERT:-/etc/letsencrypt/live/_/fullchain.pem}
#          ${NGINX_SSL_CERT_KEY:-/etc/letsencrypt/live/_/privkey.pem}

server {
    listen ${NGINX_PORT:-80} ${NGINX_DEFAULT_SERVER:-default_server};
    listen [::]:${NGINX_PORT:-80} ${NGINX_DEFAULT_SERVER:-default_server};
    server_name ${NGINX_SERVER_NAME:-_};

    return 301 https://$host$request_uri;
}

server {
    listen ${NGINX_SSL_PORT:-443} ssl ${NGINX_DEFAULT_SERVER:-default_server};
    listen [::]:${NGINX_SSL_PORT:-443} ssl ${NGINX_DEFAULT_SERVER:-default_server};
    server_name ${NGINX_SERVER_NAME:-_};

    ssl_certificate ${NGINX_SSL_CERT:-/etc/letsencrypt/live/_/fullchain.pem};
    ssl_certificate_key ${NGINX_SSL_CERT_KEY:-/etc/letsencrypt/live/_/privkey.pem};
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/zhiyu-saas-access.log;
    error_log /var/log/nginx/zhiyu-saas-error.log;

    client_max_body_size 200m;

    # kkFileView 文件预览代理
    location /kkfileview/ {
        proxy_pass http://127.0.0.1:${KKFILEVIEW_HOST_PORT:-8012};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API 后端代理
    location /api/ {
        proxy_pass http://127.0.0.1:${BACKEND_PORT:-8080};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 文件上传代理
    location /uploads/ {
        proxy_pass http://127.0.0.1:${BACKEND_PORT:-8080};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 前端入口
    location / {
        proxy_pass http://127.0.0.1:${EDU_PORT:-3020};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
