# zhiyu-saas HTTPS 网关配置（由 deploy.sh 根据 .env 自动生成）—— 边缘网关
# 职责：唯一对外 HTTPS 入口，转发到服务网关容器 nginx（127.0.0.1:${GO_NGINX_PORT:-8084}）
# 占位符：${NGINX_SSL_DOMAIN} ${NGINX_SSL_CERT} ${NGINX_SSL_CERT_KEY}
#          ${GO_NGINX_PORT:-8084} ${KKFILEVIEW_HOST_PORT:-8012}

server {
    listen 80;
    listen [::]:80;
    server_name ${NGINX_SSL_DOMAIN};
    root /var/www/certbot;

    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${NGINX_SSL_DOMAIN};

    ssl_certificate ${NGINX_SSL_CERT};
    ssl_certificate_key ${NGINX_SSL_CERT_KEY};
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200m;

    # kkfileview 为可选 profile 服务，未启用时保持 502（与原行为一致）
    location /kkfileview/ {
        proxy_pass http://127.0.0.1:${KKFILEVIEW_HOST_PORT:-8012};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 其余全部转发到服务网关容器（zhiyu-nginx），由其在容器网络内按容器名路由
    location /api/ {
        proxy_pass http://127.0.0.1:${GO_NGINX_PORT:-8084};
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:${GO_NGINX_PORT:-8084};
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:${GO_NGINX_PORT:-8084};
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
