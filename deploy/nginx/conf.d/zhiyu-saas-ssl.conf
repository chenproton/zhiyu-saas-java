# zhiyu-saas HTTPS 网关配置（由 deploy.sh 根据 .env 自动生成）—— 边缘网关
# 职责：唯一对外 HTTPS 入口，转发到服务网关容器 nginx（127.0.0.1:${JAVA_NGINX_PORT:-8083}）
# 单栈（Java+Vue）：无 /java/ 前缀分流，全部经容器网关
# 占位符：${NGINX_SSL_DOMAIN} ${NGINX_SSL_CERT} ${NGINX_SSL_CERT_KEY}
#          ${JAVA_NGINX_PORT:-8083} ${KKFILEVIEW_HOST_PORT:-8012}

server {
    listen 80;
    listen [::]:80;
    server_name ${NGINX_SSL_DOMAIN};
    root /var/www/certbot;

    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${NGINX_SSL_DOMAIN};

    ssl_certificate ${NGINX_SSL_CERT};
    ssl_certificate_key ${NGINX_SSL_CERT_KEY};
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200m;

    # kkfileview 为可选 profile 服务，未启用时保持 502（与原行为一致）
    location /kkfileview/ {
        proxy_pass http://127.0.0.1:${KKFILEVIEW_HOST_PORT:-8012};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # zhiyu 业务 API（/api/v1/**）→ 容器网关
    location /api/ {
        proxy_pass http://127.0.0.1:${JAVA_NGINX_PORT:-8083};
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # RuoYi 框架管理接口（plus-ui 管理端，/prod-api 前缀在容器网关剥离）
    location /prod-api/ {
        proxy_pass http://127.0.0.1:${JAVA_NGINX_PORT:-8083};
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:${JAVA_NGINX_PORT:-8083};
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # 其余（业务门户 SPA、plus-ui 管理端、/health 等）→ 容器网关
    location / {
        proxy_pass http://127.0.0.1:${JAVA_NGINX_PORT:-8083};
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
