# zhiyu-saas 服务网关（容器内 Nginx）
# 职责：在 Docker 网络内按容器名路由到 backend/frontend，由系统 nginx（边缘网关）转发到 127.0.0.1:${GO_NGINX_PORT:-8084}
server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    # 安全响应头（此前两个模板均无任何安全头）：
    # nosniff 防 MIME 嗅探执行上传文件；SAMEORIGIN 防点击劫持；no-referrer-when-downgrade 防降级泄露；
    # 不加 CSP/HSTS——CSP 需按前端资源逐条实测、HSTS 由 HTTPS 入口统一负责，避免误伤现网。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # 文本类响应压缩（此前完全未启用；上传/预览二进制不压缩）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml application/wasm;

    # 后端健康探针：必须显式代理到 backend。
    # 否则 /health 会落到 SPA 的 try_files fallback，返回 index.html 且 200 ——
    # 运维与部署冒烟都会得到「后端存活」的假阳性（后端全挂也 200）。
    location = /health {
        proxy_pass http://zhiyu-backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    location /api/ {
        proxy_pass http://zhiyu-backend:8080;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://zhiyu-backend:8080;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://zhiyu-edu:3020;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
    }
}
