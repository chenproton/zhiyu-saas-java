# zhiyu-saas 服务网关（容器内 Nginx）—— 单栈（Java + Vue）
# 职责：在 Docker 网络内路由到 java-backend（API/上传）与 kkfileview（文件预览），
#       静态服务 Vue 业务门户（portal，根路径）与 RuoYi 管理端（plus-ui，/plus-ui/）。
#       由系统 nginx（边缘网关）转发到 127.0.0.1:${JAVA_NGINX_PORT:-8083}
server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    # 安全响应头：nosniff 防 MIME 嗅探执行上传文件；SAMEORIGIN 防点击劫持；no-referrer-when-downgrade 防降级泄露。
    # 不加 CSP/HSTS——CSP 需按前端资源逐条实测、HSTS 由 HTTPS 入口统一负责，避免误伤现网。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # 文本类响应压缩（上传/预览二进制不压缩）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml application/wasm;

    # 后端健康探针：显式代理到 java-backend，避免落到 SPA fallback 产生假阳性
    location = /health {
        proxy_pass http://java-backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # zhiyu 业务 API（裸 JSON 契约 /api/v1/**）
    location /api/ {
        proxy_pass http://java-backend:8080;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # RuoYi 框架管理接口（plus-ui 管理端，/prod-api 前缀剥离 → /system/* 等）
    location /prod-api/ {
        proxy_pass http://java-backend:8080/;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://java-backend:8080;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # kkfileview（可选 profile 服务；未启用时 502，与既有行为一致）
    location /kkfileview/ {
        proxy_pass http://kkfileview:8012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # RuoYi 管理端（plus-ui）：/plus-ui/ 子路径，SPA fallback
    location /plus-ui/ {
        alias /usr/share/nginx/html/plus-ui/;
        index index.html;
        try_files $uri $uri/ /plus-ui/index.html;
    }

    # Vue 业务门户（portal）：根路径，SPA fallback
    location / {
        root /usr/share/nginx/html/portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
