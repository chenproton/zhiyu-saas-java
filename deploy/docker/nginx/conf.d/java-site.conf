# zhiyu-saas Java 版站点（docker compose 内 Nginx 容器）
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://java-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /uploads/ {
        proxy_pass http://java-backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # 收敛：/java/portal（无斜杠）301 → Vue 门户（有斜杠），Java 前端唯一入口
    location = /java/portal {
        return 301 $scheme://$http_host/java/portal/;
    }

    # Vue 业务门户（SPA）：dist 挂载于 /usr/share/nginx/html/java/portal
    location /java/portal/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /java/portal/index.html;
    }

    # 其余路径（含根 /）统一重定向到 Vue 门户（已无 Next.js 前端）
    location / {
        return 301 $scheme://$http_host/java/portal/;
    }
}
