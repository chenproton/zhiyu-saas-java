# zhiyu-saas Java 版部署编排（Go→Java 迁移）
# - PostgreSQL：join 线上 Go 版网络 zhiyu-saas_zhiyu，按容器名 zhiyu-postgres:5432 直连（共用同一库）
# - Redis：自带 java-redis 容器（无状态缓存，密码 ruoyi123）
# - 独立网络 zhiyu-java，不干扰线上容器
services:
  java-backend:
    image: zhiyu-java-backend:${IMAGE_TAG:-latest}
    container_name: zhiyu-java-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      ZHIYU_DB_HOST: zhiyu-postgres
      ZHIYU_DB_PORT: "5432"
      ZHIYU_DB_USER: zhiyu_saas
      ZHIYU_DB_PASSWORD: ${ZHIYU_DB_PASSWORD:?请设置 ZHIYU_DB_PASSWORD}
      ZHIYU_REDIS_HOST: java-redis
      ZHIYU_REDIS_PORT: "6379"
      ZHIYU_REDIS_PASSWORD: ruoyi123
      # 文件资产与 Go 版共享同一上传卷（业务数据对齐）
      ZHIYU_UPLOAD_DIR: /opt/zhiyu-saas/uploads
    volumes:
      - zhiyu-saas_uploads_data:/opt/zhiyu-saas/uploads
    networks:
      - zhiyu-java
      - zhiyu-saas_zhiyu
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  java-redis:
    image: redis:7-alpine
    container_name: zhiyu-java-redis-compose
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "ruoyi123"]
    networks:
      - zhiyu-java
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  java-edu:
    image: zhiyu-java-edu:${IMAGE_TAG:-latest}
    container_name: zhiyu-java-edu
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3020"
      API_PROXY_URL: "http://java-backend:8080"
      # Java 前端通过 /java/ 路径前缀访问
      NEXT_PUBLIC_BASE_PATH: "/java"
    networks:
      - zhiyu-java
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  java-nginx:
    image: nginx:1.27-alpine
    container_name: zhiyu-java-nginx
    restart: unless-stopped
    ports:
      - "${ZHIYU_JAVA_WEB_PORT:-8083}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - java-backend
      - java-edu
    networks:
      - zhiyu-java
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  zhiyu-saas_uploads_data:
    name: zhiyu-saas_uploads_data
    external: true

networks:
  zhiyu-java:
    name: zhiyu-java
    driver: bridge
  zhiyu-saas_zhiyu:
    name: zhiyu-saas_zhiyu
    external: true
