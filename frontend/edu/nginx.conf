# SPA 静态托管：监听 3020（对齐 docker-compose 健康检查与内部路由）
server {
  listen 3020;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA 深链回退：任意路径（含 /portal/login 健康检查）→ index.html，由前端路由接管
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 带 hash 的构建产物与静态资源长缓存
  location ~* \.(js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|eot|otf|avif|webp|wasm|map)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # index.html 不缓存，保证发版后即时生效
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
